<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F1E3D">
<title>Contador de Intervalos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#FFFFFF;
    --bg-soft:#F4F6FB;
    --navy:#0F1E3D;
    --blue-900:#12294F;
    --blue-700:#1B4DB0;
    --blue-600:#2A5FD9;
    --blue-500:#4A7CFF;
    --blue-100:#E7EEFF;
    --black:#12141A;
    --grey-200:#E7EAF1;
    --grey-400:#B9C0D1;
    --grey-600:#6B7280;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; overscroll-behavior:none; }
  body{
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(circle at 15% -10%, var(--blue-100) 0%, transparent 45%),
      radial-gradient(circle at 110% 5%, var(--blue-100) 0%, transparent 40%),
      var(--white);
    color:var(--navy);
    height:100dvh;
    display:flex;
    justify-content:center;
    overflow:hidden;
    touch-action:manipulation;
    -webkit-user-select:none;
    user-select:none;
  }
  input{ -webkit-user-select:text; user-select:text; }
  button{ font-family:'Inter',sans-serif; border:none; cursor:pointer; }

  .app{
    width:100%;
    max-width:480px;
    height:100dvh;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---------- HEADER ---------- */
  header{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:12px;
    padding:calc(var(--safe-top) + 16px) 20px 15px;
    border-bottom:1px solid var(--grey-200);
    background:var(--white);
  }
  .mark{
    width:52px; height:52px; flex:0 0 auto;
    border-radius:50%; object-fit:cover; display:block;
    box-shadow:0 2px 10px -3px rgba(15,30,61,0.3);
  }
  .brand h1{
    margin:0;
    font-family:'Bebas Neue',sans-serif;
    letter-spacing:0.035em;
    font-size:clamp(16px, 4.4vw, 19px);
    line-height:1;
    color:var(--black);
  }
  .brand span{
    display:block;
    font-size:10px;
    font-weight:700;
    letter-spacing:0.07em;
    margin-top:5px;
  }
  .brand-blue{ color:var(--blue-700); }
  .brand-black{ color:var(--black); }

  /* ---------- SCROLLABLE MAIN ---------- */
  main{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior-y:contain;
    padding:18px 20px 14px;
    display:flex;
    flex-direction:column;
    gap:20px;
  }

  /* ---------- SEGMENTED CONTROL (Início/Fim do Exercício) ---------- */
  .segmented{
    position:relative;
    display:grid;
    grid-template-columns:1fr 1fr;
    background:var(--bg-soft);
    border:1px solid var(--grey-200);
    border-radius:14px;
    padding:4px;
    height:52px;
  }
  .segmented-thumb{
    position:absolute;
    top:4px; left:4px; bottom:4px;
    width:calc(50% - 4px);
    border-radius:10px;
    background:var(--navy);
    box-shadow:0 2px 8px -2px rgba(15,30,61,0.35);
    transition:transform .32s cubic-bezier(.4,0,.2,1), background .2s ease, box-shadow .2s ease;
    z-index:0;
  }
  .segmented-thumb.thumb-right{ transform:translateX(100%); }
  .segmented-thumb.thumb-blue{ background:var(--blue-700); box-shadow:0 2px 8px -2px rgba(27,77,176,0.4); }
  .segmented-thumb.thumb-black{ background:var(--black); box-shadow:0 2px 8px -2px rgba(18,20,26,0.35); }
  .segmented-btn{
    position:relative;
    z-index:1;
    background:transparent;
    color:var(--grey-600);
    font-weight:700;
    font-size:10.5px;
    letter-spacing:0.02em;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    transition:color .2s ease, opacity .2s ease;
  }
  .segmented-btn svg{ width:14px; height:14px; flex:0 0 auto; }
  .segmented-btn.active{ color:var(--white); }
  .segmented-btn:disabled{ opacity:0.4; pointer-events:none; }
  .segmented.locked{ opacity:0.55; pointer-events:none; }

  /* ---------- INTERVAL BADGE ---------- */
  .interval-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .interval-badge{
    background:var(--blue-100);
    color:var(--blue-700);
    font-weight:700;
    font-size:11.5px;
    letter-spacing:0.03em;
    padding:7px 15px;
    border-radius:999px;
    border:1px solid #D6E2FF;
    text-align:center;
  }
  .reset-link{
    background:none;
    border:none;
    color:var(--grey-600);
    font-size:11px;
    font-weight:600;
    text-decoration:underline;
    text-underline-offset:2px;
    padding:6px;
    min-height:30px;
  }

  /* ---------- TIMER RING ---------- */
  .timer-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:2px 0;
  }
  .ring-box{
    position:relative;
    width:min(74vw, 280px);
    height:min(74vw, 280px);
    flex:0 0 auto;
  }
  svg.ring{ width:100%; height:100%; transform:rotate(-90deg); display:block; }
  .ring-bg{ fill:none; stroke:var(--grey-200); stroke-width:12; }
  .ring-fg{
    fill:none;
    stroke:var(--blue-600);
    stroke-width:12;
    stroke-linecap:round;
    transition:stroke-dashoffset 1s linear, stroke .25s ease;
  }
  .ring-fg.warn{ stroke:var(--black); }
  .ring-center{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:3px;
    padding:0 14px;
  }
  .time-display{
    font-family:'Bebas Neue',sans-serif;
    font-size:clamp(46px, 15vw, 62px);
    letter-spacing:0.02em;
    color:var(--black);
    line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .time-label{
    font-size:9.5px;
    font-weight:700;
    letter-spacing:0.1em;
    color:var(--grey-600);
    text-transform:uppercase;
    text-align:center;
  }

  /* play/pause — ÚNICO CONTROLE DENTRO DO CÍRCULO: apenas borda + ícone, sem fundo azul */
  .play-pause{
    margin-top:14px;
    width:64px;
    height:64px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--white);
    border:2px solid var(--blue-600);
    color:var(--blue-600);
    box-shadow:0 4px 14px -6px rgba(27,77,176,0.4);
    transition:transform .12s ease, border-color .18s ease, color .18s ease, box-shadow .18s ease;
  }
  .play-pause:active{ transform:scale(0.93); }
  .play-pause.is-running{
    border-color:var(--black);
    color:var(--black);
    box-shadow:0 4px 14px -6px rgba(18,20,26,0.3);
  }
  .play-pause svg{ width:22px; height:22px; }

  /* ---------- PRESETS ---------- */
  .presets-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  .presets-head h2{
    font-family:'Bebas Neue',sans-serif;
    font-size:14.5px;
    letter-spacing:0.04em;
    margin:0;
    color:var(--navy);
  }
  .presets-head p{
    margin:0;
    font-size:9.5px;
    color:var(--grey-600);
    font-weight:600;
    letter-spacing:0.01em;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:9px;
    margin-top:11px;
  }
  .grid.grid-3{ grid-template-columns:repeat(3, 1fr); }
  .card{
    position:relative;
    background:var(--white);
    border:1.5px solid var(--grey-200);
    border-radius:16px;
    padding:13px 4px 10px;
    min-height:70px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    cursor:pointer;
    box-shadow:0 1px 2px rgba(15,30,61,0.03);
    transition:border-color .15s ease, background .15s ease, box-shadow .15s ease, transform .1s ease;
  }
  .card:active{ transform:scale(0.95); }
  .card.selected{
    border-color:var(--blue-600);
    background:var(--blue-100);
    box-shadow:0 4px 12px -6px rgba(27,77,176,0.4);
  }
  .card.disabled{ opacity:0.45; pointer-events:none; }
  .card .val{
    font-family:'Bebas Neue',sans-serif;
    font-size:clamp(17px, 4.8vw, 19px);
    color:var(--black);
    letter-spacing:0.02em;
    font-variant-numeric:tabular-nums;
  }
  .card .tag{
    font-size:7.5px;
    font-weight:700;
    letter-spacing:0.06em;
    color:var(--grey-600);
    text-transform:uppercase;
  }
  .card.selected .tag{ color:var(--blue-700); }
  .edit-btn{
    position:absolute; top:0; right:0;
    width:30px; height:30px;
    display:flex; align-items:center; justify-content:center;
    padding:0; background:transparent; border:none;
  }
  .edit-btn svg{ width:11px; height:11px; stroke:var(--grey-600); }
  .card-edit-input{
    width:54px;
    text-align:center;
    font-family:'Bebas Neue',sans-serif;
    font-size:18px;
    border:1.5px solid var(--blue-600);
    border-radius:8px;
    padding:5px 2px;
    color:var(--black);
    outline:none;
  }

  /* ---------- MAIN BOTTOM SPACING (compensa a safe-area, já que não há mais rodapé fixo) ---------- */
  main{
    padding-bottom:calc(var(--safe-bottom) + 18px);
  }

  /* ---------- AJUSTES FINOS PARA TELAS MUITO PEQUENAS ---------- */
  @media (max-width:360px){
    .mark{ width:46px; height:46px; }
    .brand span{ font-size:9px; }
    .grid{ grid-template-columns:repeat(3, 1fr); }
    .ring-box{ width:min(76vw, 260px); height:min(76vw, 260px); }
  }

  /* ---------- APRESENTAÇÃO EM TELAS LARGAS (tablet/desktop): app em moldura centralizada ---------- */
  @media (min-width:481px){
    body{ background:var(--bg-soft); }
    .app{
      margin:24px 0;
      height:calc(100dvh - 48px);
      max-height:900px;
      border-radius:28px;
      overflow:hidden;
      box-shadow:0 30px 70px -30px rgba(15,30,61,0.35), 0 0 0 1px var(--grey-200);
    }
  }
</style>
</head>

  var editingStopwatchIndex = null;

  var RADIUS = 108;
  var CIRC = 2 * Math.PI * RADIUS;

  // =========================================================
  // ESTADO DA SESSÃO DE EXERCÍCIO (Início / Fim — apenas status)
  // =========================================================
  var exerciseStatus = 'idle'; // 'idle' | 'started' | 'finished'

  // ---------- DOM ----------
  var grid = document.getElementById('presetGrid');
  var presetsSection = document.getElementById('presetsSection');
  var stopwatchGrid = document.getElementById('stopwatchGrid');
  var stopwatchSection = document.getElementById('stopwatchSection');
  var timeDisplay = document.getElementById('timeDisplay');
  var timeLabel = document.getElementById('timeLabel');
  var intervalBadge = document.getElementById('intervalBadge');
  var resetCountBtn = document.getElementById('resetCountBtn');
  var ringFg = document.getElementById('ringFg');
  var playPauseBtn = document.getElementById('playPauseBtn');
  var playIcon = document.getElementById('playIcon');
  var pauseIcon = document.getElementById('pauseIcon');
  var modeSegment = document.getElementById('modeSegment');
  var modeThumb = document.getElementById('modeThumb');
  var modeCountdownBtn = document.getElementById('modeCountdownBtn');
  var modeStopwatchBtn = document.getElementById('modeStopwatchBtn');
  var exerciseSegment = document.getElementById('exerciseSegment');
  var exerciseThumb = document.getElementById('exerciseThumb');
  var startExerciseBtn = document.getElementById('startExerciseBtn');
  var endExerciseBtn = document.getElementById('endExerciseBtn');

  ringFg.setAttribute('stroke-dasharray', CIRC.toFixed(1));

  // =========================================================
  // ÁUDIO (bipes sintetizados, sem arquivos externos)
  // =========================================================
  var audioCtx = null;
  function getCtx(){
    if(!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
    return audioCtx;
  }
  function tone(freq, start, dur, gainVal){
    var ctx = getCtx();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, ctx.currentTime + start);
    gain.gain.linearRampToValueAtTime(gainVal, ctx.currentTime + start + 0.01);
    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + start + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(ctx.currentTime + start);
    osc.stop(ctx.currentTime + start + dur + 0.02);
  }
  function playWarningBeeps(){
    // dois bipes sonoros quando faltam 5 segundos
    tone(880, 0, 0.14, 0.22);
    tone(880, 0.22, 0.14, 0.22);
  }
  function playFinishSound(){
    tone(660, 0, 0.12, 0.22);
    tone(660, 0.16, 0.12, 0.22);
    tone(990, 0.32, 0.22, 0.24);
  }

  // ---------- HELPERS ----------
  function formatTime(s){
    var m = Math.floor(s/60);
    var sec = s % 60;
    return (m<10?'0':'')+m+':'+(sec<10?'0':'')+sec;
  }
  function ordinal(n){ return n + 'º'; }

  function isFreshStart(){
    if(mode === 'countdown'){ return remaining === presets[selectedIndex]; }
    return elapsed === 0;
  }

  function updateRing(){
    if(mode === 'countdown'){
      var total = presets[selectedIndex];
      var frac = total > 0 ? remaining/total : 0;
      var offset = CIRC * (1 - frac);
      ringFg.setAttribute('stroke-dashoffset', offset.toFixed(1));
      ringFg.classList.toggle('warn', remaining <= 5 && running);
    } else {
      // cronômetro: o anel preenche em direção à meta selecionada (30", 60" ou 2min)
      var target = stopwatchPresets[selectedStopwatchIndex];
      var frac2 = target > 0 ? Math.min(elapsed/target, 1) : 0;
      var offset2 = CIRC * (1 - frac2);
      ringFg.setAttribute('stroke-dashoffset', offset2.toFixed(1));
      ringFg.classList.toggle('warn', targetReached);
    }
  }

  function renderTimeDisplay(){
    timeDisplay.textContent = mode === 'countdown' ? formatTime(remaining) : formatTime(elapsed);
  }

  function setPlayPauseIcon(){
    playIcon.style.display = running ? 'none' : 'block';
    pauseIcon.style.display = running ? 'block' : 'none';
    playPauseBtn.classList.toggle('is-running', running);
  }

  // =========================================================
  // CARDS DE TEMPO PRÉ-DEFINIDO (editáveis)
  // =========================================================
  function renderGrid(){
    grid.innerHTML = '';
    presets.forEach(function(sec, idx){
      var card = document.createElement('div');
      card.className = 'card' + (idx === selectedIndex ? ' selected' : '') + (running ? ' disabled' : '');

      var editBtn = document.createElement('button');
      editBtn.className = 'edit-btn';
      editBtn.type = 'button';
      editBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
      editBtn.addEventListener('click', function(e){
        e.stopPropagation();
        if(running) return;
        editingIndex = idx;
        renderGrid();
        var input = card.querySelector('.card-edit-input');
        if(input){ input.focus(); input.select(); }
      });

      if(editingIndex === idx){
        var input = document.createElement('input');
        input.type = 'number';
        input.inputMode = 'numeric';
        input.min = '1';
        input.max = '5999';
        input.className = 'card-edit-input';
        input.value = sec;
        var tag = document.createElement('div');
        tag.className = 'tag';
        tag.textContent = 'segundos';

        function commit(){
          var v = parseInt(input.value, 10);
          if(isNaN(v) || v <= 0){ v = sec; }
          presets[idx] = v;
          editingIndex = null;
          if(idx === selectedIndex && !running && mode === 'countdown'){
            remaining = presets[selectedIndex];
            renderTimeDisplay();
            updateRing();
          }
          renderGrid();
        }
        input.addEventListener('keydown', function(e){
          if(e.key === 'Enter'){ commit(); }
          if(e.key === 'Escape'){ editingIndex = null; renderGrid(); }
        });
        input.addEventListener('blur', commit);

        card.appendChild(editBtn);
        card.appendChild(input);
        card.appendChild(tag);
      } else {
        var val = document.createElement('div');
        val.className = 'val';
        val.textContent = formatTime(sec);
        var tag2 = document.createElement('div');
        tag2.className = 'tag';
        tag2.textContent = 'CARD ' + (idx+1);

        card.addEventListener('click', function(){
          if(running) return;
          selectedIndex = idx;
          remaining = presets[selectedIndex];
          renderGrid();
          renderTimeDisplay();
          updateRing();
          timeLabel.textContent = 'TEMPO SELECIONADO';
        });

        card.appendChild(editBtn);
        card.appendChild(val);
        card.appendChild(tag2);
      }

      grid.appendChild(card);
    });
  }

  // =========================================================
  // METAS EDITÁVEIS DO CRONÔMETRO (30", 60", 2min)
  // =========================================================
  function renderStopwatchGrid(){
    stopwatchGrid.innerHTML = '';
    stopwatchPresets.forEach(function(sec, idx){
      var card = document.createElement('div');
      card.className = 'card' + (idx === selectedStopwatchIndex ? ' selected' : '') + (running ? ' disabled' : '');

      var editBtn = document.createElement('button');
      editBtn.className = 'edit-btn';
      editBtn.type = 'button';
      editBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
      editBtn.addEventListener('click', function(e){
        e.stopPropagation();
        if(running) return;
        editingStopwatchIndex = idx;
        renderStopwatchGrid();
        var input = card.querySelector('.card-edit-input');
        if(input){ input.focus(); input.select(); }
      });

      if(editingStopwatchIndex === idx){
        var input = document.createElement('input');
        input.type = 'number';
        input.inputMode = 'numeric';
        input.min = '1';
        input.max = '5999';
        input.className = 'card-edit-input';
        input.value = sec;
        var tag = document.createElement('div');
        tag.className = 'tag';
        tag.textContent = 'segundos';

        function commit(){
          var v = parseInt(input.value, 10);
          if(isNaN(v) || v <= 0){ v = sec; }
          stopwatchPresets[idx] = v;
          editingStopwatchIndex = null;
          if(idx === selectedStopwatchIndex && !running){ updateRing(); }
          renderStopwatchGrid();
        }
        input.addEventListener('keydown', function(e){
          if(e.key === 'Enter'){ commit(); }
          if(e.key === 'Escape'){ editingStopwatchIndex = null; renderStopwatchGrid(); }
        });
        input.addEventListener('blur', commit);

        card.appendChild(editBtn);
        card.appendChild(input);
        card.appendChild(tag);
      } else {
        var val = document.createElement('div');
        val.className = 'val';
        val.textContent = formatTime(sec);
        var tag2 = document.createElement('div');
        tag2.className = 'tag';
        tag2.textContent = 'META';

        card.addEventListener('click', function(){
          if(running) return;
          selectedStopwatchIndex = idx;
          targetReached = elapsed >= stopwatchPresets[idx];
          timeLabel.textContent = targetReached ? 'META ATINGIDA' : 'TEMPO DECORRIDO';
          renderStopwatchGrid();
          updateRing();
        });

        card.appendChild(editBtn);
        card.appendChild(val);
        card.appendChild(tag2);
      }

      stopwatchGrid.appendChild(card);
    });
  }

  // =========================================================
  // ALTERNAR MODO: CONTAGEM REGRESSIVA ↔ CRONÔMETRO
  // =========================================================
  function applyMode(){
    var isCountdown = mode === 'countdown';
    modeCountdownBtn.classList.toggle('active', isCountdown);
    modeStopwatchBtn.classList.toggle('active', !isCountdown);
    modeThumb.classList.toggle('thumb-right', !isCountdown);
    presetsSection.style.display = isCountdown ? 'block' : 'none';
    stopwatchSection.style.display = isCountdown ? 'none' : 'block';
    timeLabel.textContent = isCountdown ? 'TEMPO SELECIONADO' : 'TEMPO DECORRIDO';
    renderTimeDisplay();
    updateRing();
  }

  function setMode(newMode){
    if(running) return; // troca de modo só é permitida com o cronômetro pausado/parado
    mode = newMode;
    remaining = presets[selectedIndex];
    elapsed = 0;
    targetReached = false;
    applyMode();
  }

  modeCountdownBtn.addEventListener('click', function(){ setMode('countdown'); });
  modeStopwatchBtn.addEventListener('click', function(){ setMode('stopwatch'); });

  // =========================================================
  // PLAY / PAUSE — único controle de acionamento, dentro do círculo
  // =========================================================
  function tickCountdown(){
    remaining -= 1;
    if(remaining === 5){ playWarningBeeps(); }
    if(remaining <= 0){
      remaining = 0;
      renderTimeDisplay();
      updateRing();
      playFinishSound();
      pauseTimer();
      remaining = presets[selectedIndex]; // pronto para o próximo intervalo
      renderTimeDisplay();
      updateRing();
      timeLabel.textContent = 'INTERVALO CONCLUÍDO';
      return;
    }
    renderTimeDisplay();
    updateRing();
  }

  function tickStopwatch(){
    elapsed += 1;
    var target = stopwatchPresets[selectedStopwatchIndex];
    if(!targetReached && elapsed >= target){
      targetReached = true;
      playWarningBeeps();
      timeLabel.textContent = 'META ATINGIDA';
    }
    renderTimeDisplay();
    updateRing();
  }

  function startTimer(){
    if(running) return;
    getCtx(); // desbloqueia áudio via gesto do usuário
    if(isFreshStart()){
      intervalCount += 1;
      intervalBadge.textContent = ordinal(intervalCount) + ' INTERVALO';
    }
    running = true;
    if(mode === 'countdown'){
      timeLabel.textContent = 'EM ANDAMENTO';
    } else if(!targetReached){
      timeLabel.textContent = 'TEMPO DECORRIDO';
    }
    setPlayPauseIcon();
    renderGrid();
    renderStopwatchGrid();
    modeSegment.classList.add('locked');
    timerHandle = setInterval(mode === 'countdown' ? tickCountdown : tickStopwatch, 1000);
  }

  function pauseTimer(){
    running = false;
    clearInterval(timerHandle);
    timerHandle = null;
    setPlayPauseIcon();
    renderGrid();
    renderStopwatchGrid();
    modeSegment.classList.remove('locked');
  }

  playPauseBtn.addEventListener('click', function(){
    if(running){ pauseTimer(); } else { startTimer(); }
  });

  resetCountBtn.addEventListener('click', function(){
    pauseTimer();
    intervalCount = 0;
    intervalBadge.textContent = 'PRONTO PARA COMEÇAR';
    remaining = presets[selectedIndex];
    elapsed = 0;
    targetReached = false;
    timeLabel.textContent = mode === 'countdown' ? 'TEMPO SELECIONADO' : 'TEMPO DECORRIDO';
    renderTimeDisplay();
    updateRing();
  });

  // =========================================================
  // INÍCIO DO EXERCÍCIO / FIM DO EXERCÍCIO — apenas marcadores
  // de status da sessão, não controlam o cronômetro
  // =========================================================
  function applyExerciseStatus(){
    if(exerciseStatus === 'idle'){
      startExerciseBtn.disabled = false;
      endExerciseBtn.disabled = true;
      startExerciseBtn.classList.add('active');
      endExerciseBtn.classList.remove('active');
      exerciseThumb.classList.remove('thumb-right');
      exerciseThumb.classList.remove('thumb-black');
      exerciseThumb.classList.add('thumb-blue');
    } else if(exerciseStatus === 'started'){
      startExerciseBtn.disabled = true;
      endExerciseBtn.disabled = false;
      startExerciseBtn.classList.remove('active');
      endExerciseBtn.classList.add('active');
      exerciseThumb.classList.add('thumb-right');
      exerciseThumb.classList.remove('thumb-blue');
      exerciseThumb.classList.add('thumb-black');
    } else {
      startExerciseBtn.disabled = false;
      endExerciseBtn.disabled = true;
      startExerciseBtn.classList.add('active');
      endExerciseBtn.classList.remove('active');
      exerciseThumb.classList.remove('thumb-right');
      exerciseThumb.classList.remove('thumb-black');
      exerciseThumb.classList.add('thumb-blue');
    }
  }

  startExerciseBtn.addEventListener('click', function(){
    exerciseStatus = 'started';
    applyExerciseStatus();
  });

  endExerciseBtn.addEventListener('click', function(){
    exerciseStatus = 'finished';
    applyExerciseStatus();
  });

  // ---------- INIT ----------
  renderGrid();
  renderStopwatchGrid();
  applyMode();
  setPlayPauseIcon();
  applyExerciseStatus();
})();
</script>
</body>
</html>
